[project]
name = "swarmd"
version = "0.1.0"
description = "Local swarm daemon: board, workers, verifier, monitor for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
swarm = "swarmd.cli:main"
todo = "swarmd.cli:main"
swarm-mcp = "swarmd.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarmd"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "swarmd/_templates"  # starter templates (swarmd/templates.py) for non-plugin installs

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
